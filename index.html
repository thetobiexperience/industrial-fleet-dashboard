<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Industrial Fleet Dashboard</title>

    <link rel="stylesheet" href="styles.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>

<body>
    <header>
      <div class="header-content">
        <h1>Industrial Fleet Dashboard</h1>
        <p>Monitor machine status and operating data.</p>
      </div>
    </header>

    <main>
        <section>

            <h2>Fleet Overview</h2>
            <p class="section-description">
                View, search and monitor all machines.
            </p>

              <div class="toolbar">
                <input
                    type="text"
                    id="search-input"
                    placeholder="Search machine..."
                >

                <select id="status-dropdown">
                    <option value="All">All</option>
                    <option value="Running">Running</option>
                    <option value="Maintenance">Maintenance</option>
                    <option value="Offline">Offline</option>
                </select>

                <select id="sort-dropdown">
                    <option value="name">Name</option>
                    <option value="hours">Operating hours</option>
                    <option value="temperature">Temperature</option>
                </select>
              </div>
            <div class="summary">
                <div class="summary-card">
                    <strong id="running-count">0</strong>
                    <span>/ Running 🟢</span>
                </div>

                <div class="summary-card">
                    <strong id="maintenance-count">0</strong>
                    <span>/ Maintenance 🟡</span>
                </div>

                <div class="summary-card">
                    <strong id="offline-count">0</strong>
                    <span>/ Offline 🔴</span>
                </div>
            </div>

            <div class="dashboard-content">

                <div id="machine-container"></div>

                <aside id="machine-details">
                    <h2>Select a machine</h2>
                    <p>Click on a machine card to view details.</p>
                </aside>

            </div>

            <div id="machine-details" class="machine-details hidden">
                <h2 id="details-name"></h2>
                <p id="details-status"></p>
                <p id="details-hours"></p>
                <p id="details-location"></p>
                <p id="details-temperature"></p>
            </div>

        </section>
    </main>

    <script src="app.js"></script>
</body>
</html>
