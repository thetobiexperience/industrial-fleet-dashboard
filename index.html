<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Industrial Fleet Dashboard</title>

    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <header>
        <h1>Industrial Fleet Dashboard</h1>
        <p>Monitor machine status and operating data.</p>
    </header>

    <main>
        <section>
            <h2>Fleet Overview</h2>

            <input
                type="text"
                id="search-input"
                placeholder="Search machine..."
            >

            <div class="summary">
                <div class="summary-card">
                    <span>Running</span>
                    <strong id="running-count">0</strong>
                </div>

                <div class="summary-card">
                    <span>Maintenance</span>
                    <strong id="maintenance-count">0</strong>
                </div>

                <div class="summary-card">
                    <span>Offline</span>
                    <strong id="offline-count">0</strong>
                </div>
            </div>

            <div id="machine-container"></div>

        </section>
    </main>

    <script src="app.js"></script>
</body>
</html>
